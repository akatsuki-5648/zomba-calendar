<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゾンバ共同作業カレンダー</title>
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a23;
    --panel2:#1e2230;
    --border:#2a2f3d;
    --text:#e8e9ee;
    --sub:#9aa0b4;
    --accent:#7c9cff;
    --accent2:#ff8a65;
    --today:#3ddc97;
    --danger:#ff5f6d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:16px;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:16px;
  }
  h1{font-size:1.3rem;margin:0;letter-spacing:.02em;}
  h1 span{color:var(--accent);}
  .nav{display:flex;align-items:center;gap:8px;}
  button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:.9rem;
  }
  button:hover{border-color:var(--accent);}
  #monthLabel{font-size:1.1rem;font-weight:bold;min-width:130px;text-align:center;}
  .calendar{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:560px;}
  th{
    padding:8px 4px;
    font-size:.78rem;
    color:var(--sub);
    font-weight:normal;
  }
  th.sun{color:var(--danger);}
  th.sat{color:var(--accent);}
  td{
    vertical-align:top;
    height:92px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px;
    position:relative;
    background:var(--panel2);
  }
  td.empty{background:transparent;border:none;}
  td.today{outline:2px solid var(--today);}
  .daynum{font-size:.85rem;color:var(--sub);}
  td.sun .daynum{color:var(--danger);}
  td.sat .daynum{color:var(--accent);}
  .events{margin-top:4px;display:flex;flex-direction:column;gap:3px;max-height:56px;overflow-y:auto;}
  .event{
    background:rgba(124,156,255,.18);
    border-left:3px solid var(--accent);
    border-radius:4px;
    padding:2px 5px;
    font-size:.7rem;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:4px;
  }
  .event:hover{background:rgba(124,156,255,.32);}
  .event .x{color:var(--sub);cursor:pointer;}
  .add-day{
    position:absolute;top:4px;right:4px;
    font-size:.75rem;color:var(--sub);
    background:none;border:none;padding:2px 6px;cursor:pointer;
  }
  .add-day:hover{color:var(--accent);}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:20px;width:100%;max-width:380px;
  }
  .modal h3{margin-top:0;font-size:1rem;}
  .modal label{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 4px;}
  .modal input, .modal select, .modal textarea{
    width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:.9rem;
  }
  .modal textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal-actions button.primary{background:var(--accent);border-color:var(--accent);color:#0f1117;font-weight:bold;}
  .legend{margin-top:14px;font-size:.75rem;color:var(--sub);text-align:center;}
  footer{text-align:center;font-size:.72rem;color:var(--sub);margin-top:20px;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗓️ <span>ゾンバ</span>共同作業カレンダー</h1>
    <div class="nav">
      <button id="prevBtn">←</button>
      <div id="monthLabel"></div>
      <button id="nextBtn">→</button>
      <button id="todayBtn">今日</button>
    </div>
  </header>

  <div class="calendar">
    <table>
      <thead>
        <tr id="weekHead"></tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>

  <div class="legend">日付の右上「＋」で予定を追加。予定は各自のブラウザに保存されます（このページはローカル保存のみ）。</div>
  <footer>ゾンバさんとの共同作業 / Discord カレンダー</footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">予定を追加</h3>
    <label>タイトル</label>
    <input type="text" id="evTitle" placeholder="例：定例MTG">
    <label>メモ</label>
    <textarea id="evMemo" placeholder="任意"></textarea>
    <div class="modal-actions">
      <button id="cancelBtn">キャンセル</button>
      <button class="primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = "zomba_calendar_events_v1";
  var current = new Date();
  current.setDate(1);
  var pendingDateKey = null;

  function loadEvents(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveEvents(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
  var events = loadEvents();

  function dateKey(y,m,d){
    return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  }

  var weekNames = ["日","月","火","水","木","金","土"];

  function render(){
    var y = current.getFullYear();
    var m = current.getMonth();
    document.getElementById("monthLabel").textContent = y + "年 " + (m+1) + "月";

    var head = document.getElementById("weekHead");
    head.innerHTML = "";
    weekNames.forEach(function(w,i){
      var th = document.createElement("th");
      th.textContent = w;
      if(i===0) th.className="sun";
      if(i===6) th.className="sat";
      head.appendChild(th);
    });

    var firstDay = new Date(y,m,1).getDay();
    var lastDate = new Date(y,m+1,0).getDate();
    var todayStr = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

    var body = document.getElementById("calBody");
    body.innerHTML = "";
    var row = document.createElement("tr");
    for(var i=0;i<firstDay;i++){
      var td = document.createElement("td");
      td.className = "empty";
      row.appendChild(td);
    }
    var dow = firstDay;
    for(var d=1; d<=lastDate; d++){
      if(dow === 7){
        body.appendChild(row);
        row = document.createElement("tr");
        dow = 0;
      }
      var key = dateKey(y,m,d);
      var td = document.createElement("td");
      var cls = [];
      if(dow===0) cls.push("sun");
      if(dow===6) cls.push("sat");
      if(key===todayStr) cls.push("today");
      td.className = cls.join(" ");

      var num = document.createElement("div");
      num.className = "daynum";
      num.textContent = d;
      td.appendChild(num);

      var addBtn = document.createElement("button");
      addBtn.className = "add-day";
      addBtn.textContent = "＋";
      addBtn.onclick = (function(k){ return function(){ openModal(k); }; })(key);
      td.appendChild(addBtn);

      var evWrap = document.createElement("div");
      evWrap.className = "events";
      (events[key]||[]).forEach(function(ev, idx){
        var evEl = document.createElement("div");
        evEl.className = "event";
        var span = document.createElement("span");
        span.textContent = ev.title;
        span.title = ev.memo || "";
        var x = document.createElement("span");
        x.className = "x";
        x.textContent = "×";
        x.onclick = (function(k,i){ return function(ev2){ ev2.stopPropagation(); removeEvent(k,i); }; })(key, idx);
        evEl.appendChild(span);
        evEl.appendChild(x);
        evWrap.appendChild(evEl);
      });
      td.appendChild(evWrap);

      row.appendChild(td);
      dow++;
    }
    while(dow!==0 && dow<7){
      var pad = document.createElement("td");
      pad.className = "empty";
      row.appendChild(pad);
      dow++;
    }
    body.appendChild(row);
  }

  function removeEvent(key, idx){
    if(!events[key]) return;
    events[key].splice(idx,1);
    if(events[key].length===0) delete events[key];
    saveEvents(events);
    render();
  }

  function openModal(key){
    pendingDateKey = key;
    document.getElementById("modalTitle").textContent = key + " の予定";
    document.getElementById("evTitle").value = "";
    document.getElementById("evMemo").value = "";
    document.getElementById("modalBg").classList.add("open");
    document.getElementById("evTitle").focus();
  }
  function closeModal(){
    document.getElementById("modalBg").classList.remove("open");
    pendingDateKey = null;
  }

  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("modalBg").onclick = function(e){
    if(e.target === this) closeModal();
  };
  document.getElementById("saveBtn").onclick = function(){
    var title = document.getElementById("evTitle").value.trim();
    if(!title || !pendingDateKey) return;
    var memo = document.getElementById("evMemo").value.trim();
    if(!events[pendingDateKey]) events[pendingDateKey] = [];
    events[pendingDateKey].push({title: title, memo: memo});
    saveEvents(events);
    closeModal();
    render();
  };

  document.getElementById("prevBtn").onclick = function(){
    current.setMonth(current.getMonth()-1);
    render();
  };
  document.getElementById("nextBtn").onclick = function(){
    current.setMonth(current.getMonth()+1);
    render();
  };
  document.getElementById("todayBtn").onclick = function(){
    current = new Date();
    current.setDate(1);
    render();
  };

  render();
})();
</script>
</body>
</html>
